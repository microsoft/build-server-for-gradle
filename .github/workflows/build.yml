# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Build

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          # Checkstyle and build for the module 'server' only enabled in Java 17.
          - java-version: 8
            gradle-version: 8.14
            build-command: ./gradlew clean build -x checkstyleMain -x checkstyleTest -x :server:build
          - java-version: 11
            gradle-version: 8.14
            build-command: ./gradlew clean build -x checkstyleMain -x checkstyleTest -x :server:build
          - java-version: 17
            gradle-version: 9.2
            build-command: ./gradlew clean build
          - java-version: 21
            gradle-version: 9.2
            build-command: ./gradlew clean build
          - java-version: 25
            gradle-version: 9.2
            build-command: ./gradlew clean build

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: ${{ matrix.gradle-version}} # Quotes required to prevent YAML converting to number
    - name: Execute Gradle build
      run: ${{ matrix.build-command }}
